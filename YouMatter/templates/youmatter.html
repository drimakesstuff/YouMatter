<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>You Matter</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
<style>
  /* Reset and basic styles */
  body, html {
    margin: 0; padding: 0; height: 100%; width: 100%;
    font-family: 'Press Start 2P', cursive;
    background: brown;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
  }

  .wrapper {
    width: 100%;
    max-width: 800px;
    padding: 2rem;
    box-sizing: border-box;
  }

  .screen {
    padding: 2rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
  }

  h1 {
    font-size: 32px;
    margin-bottom: 60px;
    color: #ffe4ec;
  }

  .button-container {
    display: flex;
    flex-direction: column;
    gap: 20px;
    width: 100%;
    max-width: 400px;
  }

  a {
    text-decoration: none;
    background-color: #ffe4ec;
    padding: 16px;
    border: 3px solid #b17e7e;
    color: #c86666;
    font-size: 14px;
    transition: background-color 0.3s ease;
    text-align: center;
  }

  a:hover {
    background-color: #ffb6c1;
  }

  /* Responsive tweaks */
  @media (max-width: 768px) {
    h1 {
      font-size: 24px;
    }
    a {
      font-size: 12px;
      padding: 12px;
    }
  }

  @media (max-width: 400px) {
    h1 {
      font-size: 16px;
    }
    a {
      font-size: 10px;
      padding: 10px;
    }
  }
</style>
</head>
<body>
  <div class="wrapper">
    <div class="screen">
      <h1>YOU MATTER</h1>
      <div class="button-container">
        <a href="/vent">Vent Out</a>
        <a href="/book">Book Your Slot</a> 
        <a href="/askforhelp">Ask for Help</a>
      </div>
    </div>
  </div>
</body>
</html>
